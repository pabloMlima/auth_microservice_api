spring.application.name=authmicroservice

#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/authmicroservice
spring.datasource.username=userauth
spring.datasource.password=passauthmicroservice
spring.jpa.hibernate.ddl-auto=update

#JWT configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Flyway configuration
spring.flyway.repair=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuração do Actuator
management.endpoint.health.show-details=always

# Exposição das métricas do Actuator
management.endpoints.web.exposure.include=health, info, openapi, swagger-ui
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

spring.profiles.active=local

# Configuração do Spring Mail
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USER}
spring.mail.password=${SPRING_MAIL_PASS}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

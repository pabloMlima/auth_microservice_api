spring.application.name=authmicroservice

#DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/authmicroservice
spring.datasource.username=userauth
spring.datasource.password=passauthmicroservice
spring.jpa.hibernate.ddl-auto=update

#JWT configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Flyway configuration
spring.flyway.repair=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Configuração do Actuator
management.endpoint.health.show-details=always

# Configuração do Circuit Breaker com Resilience4j (via Spring Cloud Starter)
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.userRepositoryBreaker.baseConfig=default

# Configuração do Retry
resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=1s
resilience4j.retry.configs.default.retryExceptions=java.io.IOException,java.util.concurrent.TimeoutException
resilience4j.retry.instances.userRepositoryRetry.baseConfig=default

# Configuração do Time Limiter
resilience4j.timelimiter.configs.default.timeoutDuration=2s
resilience4j.timelimiter.instances.userRepositoryTimeLimiter.baseConfig=default

# Configuração do Bulkhead
resilience4j.bulkhead.configs.default.maxConcurrentCalls=5
resilience4j.bulkhead.configs.default.maxWaitDuration=0ms
resilience4j.bulkhead.instances.userRepositoryBulkhead.baseConfig=default

# Exposição das métricas do Actuator
management.endpoints.web.exposure.include=health, info, openapi, swagger-ui
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true


spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: auth_micro_service_postgres
    restart: always
    environment:
      POSTGRES_USER: userauth
      POSTGRES_PASSWORD: passauthmicroservice
      POSTGRES_DB: authmicroservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
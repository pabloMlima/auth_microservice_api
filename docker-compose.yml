version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: auth_micro_service_postgres
    restart: always
    environment:
      POSTGRES_USER: userauth
      POSTGRES_PASSWORD: passauthmicroservice
      POSTGRES_DB: authmicroservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  sonar:
    image: sonarqube:latest
    container_name: sonar
    restart: always
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/authmicroservice
      SONAR_JDBC_USERNAME: userauth
      SONAR_JDBC_PASSWORD: passauthmicroservice
volumes:
  postgres_data: